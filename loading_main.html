
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garry's Mod — Loading Screen</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Roboto:wght@300;400;700&display=swap');

        :root {
            --accent: #ff7a18;
            --bg: #101116;
            --text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Фоновое изображение */
        .background {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                linear-gradient(90deg,
                    rgba(10, 11, 17, 0.95),
                    rgba(10, 11, 17, 0.45)),
                url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=85')
                center / cover no-repeat;
            transform: scale(1.04);
            animation: bgMove 18s ease-in-out infinite alternate;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(
                0deg,
                rgba(8, 9, 14, 0.98) 0%,
                transparent 65%
            );
        }

        @keyframes bgMove {
            from { transform: scale(1.04); }
            to { transform: scale(1.12); }
        }

        /* Верхняя панель */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 6%;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .logo span {
            color: var(--accent);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #ddd;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #49e58c;
            box-shadow: 0 0 12px #49e58c;
        }

        /* Основной контент */
        main {
            position: absolute;
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
            max-width: 700px;
            width: 84%;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 12px;
            letter-spacing: 5px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(38px, 7vw, 82px);
            line-height: 1.05;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
        }

        .description {
            max-width: 500px;
            color: #c3c4cc;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        /* Кнопки */
        .buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            padding: 0 25px;
            border: 1px solid #ffffff35;
            color: white;
            background: #ffffff0b;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.25s;
        }

        .button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #111;
        }

        .button:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .button.primary:hover {
            background: #ff994b;
        }

        /* Нижняя панель */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 28px 6%;
            background: linear-gradient(transparent, #090a10ed);
        }

        .loading-info {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 13px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #d5d5dd;
        }

        .loading-info strong {
            color: var(--accent);
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: #ffffff20;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transition: width 0.3s ease;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
            font-size: 10px;
            color: #777b89;
            letter-spacing: 1px;
        }

        /* Музыка */
        .music-button {
            position: fixed;
            right: 6%;
            top: 95px;
            width: 42px;
            height: 42px;
            background: #101116bb;
            border: 1px solid #ffffff35;
            color: white;
            cursor: pointer;
            font-size: 17px;
        }

        .music-button:hover {
            border-color: var(--accent);
        }

        @media (max-width: 600px) {
            header {
                padding: 22px 6%;
            }

            .logo {
                font-size: 16px;
            }

            .status {
                font-size: 9px;
                letter-spacing: 1px;
            }

            main {
                left: 6%;
                width: 88%;
            }

            .description {
                font-size: 14px;
            }

            footer {
                padding: 22px 6%;
            }

            .footer-bottom {
                font-size: 9px;
            }

            .music-button {
                top: 78px;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="overlay"></div>

    <header>
        <div class="logo">YOUR<span>SERVER</span></div>

        <div class="status">
            <div class="status-dot"></div>
            GARry's MOD SERVER
        </div>
    </header>

    <button
        class="music-button"
        id="musicButton"
        aria-label="Включить или выключить музыку"
        title="Музыка"
    >♫</button>

    <main>
        <div class="eyebrow">WELCOME TO OUR COMMUNITY</div>

        <h1>
            YOUR<br>
            <span>STORY</span><br>
            BEGINS
        </h1>

        <p class="description">
            Добро пожаловать на наш сервер Garry's Mod!
            Подготовься к игре, изучи правила и стань
            частью нашего сообщества.
        </p>

        <div class="buttons">
            <a class="button primary" href="https://discord.com/"
               target="_blank" rel="noopener">
                Discord ↗
            </a>

            <button class="button" id="copyIp">
                Копировать IP
            </button>

            <a class="button" href="https://steamcommunity.com/"
               target="_blank" rel="noopener">
                Steam ↗
            </a>
        </div>
    </main>

    <footer>
        <div class="loading-info">
            <span id="loadingText">ПОДГОТОВКА К ПОДКЛЮЧЕНИЮ...</span>
            <strong id="loadingPercent">0%</strong>
        </div>

        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="footer-bottom">
            <span>GARRY'S MOD • COMMUNITY SERVER</span>
            <span id="tip">TIP: УВАЖАЙ ДРУГИХ ИГРОКОВ</span>
        </div>
    </footer>

    <audio id="music" loop preload="none">
        <!-- Замени на ссылку на свою музыку -->
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // НАСТРОЙКИ СЕРВЕРА
        const SERVER_IP = "123.123.123.123:27015";

        const tips = [
            "TIP: УВАЖАЙ ДРУГИХ ИГРОКОВ",
            "TIP: ИЗУЧИ ПРАВИЛА СЕРВЕРА",
            "TIP: ПРИСОЕДИНЯЙСЯ К DISCORD",
            "TIP: ПРИЯТНОЙ ИГРЫ!"
        ];

        const progressBar = document.getElementById("progressBar");
        const loadingPercent = document.getElementById("loadingPercent");
        const loadingText = document.getElementById("loadingText");
        const tip = document.getElementById("tip");

        // ДЕМОНСТРАЦИОННЫЙ ПРОГРЕСС.
        // Это не реальный прогресс загрузки Garry's Mod.
        let progress = 0;

        const demo = setInterval(() => {
            progress += Math.random() * 5;

            if (progress >= 100) {
                progress = 100;
                clearInterval(demo);
                loadingText.textContent = "ГОТОВО К ИГРЕ";
            }

            progressBar.style.width = progress + "%";
            loadingPercent.textContent = Math.floor(progress) + "%";
        }, 450);

        // Подсказки
        let tipIndex = 0;

        setInterval(() => {
            tipIndex = (tipIndex + 1) % tips.length;
            tip.textContent = tips[tipIndex];
        }, 4000);

        // Копирование IP
        document.getElementById("copyIp").addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(SERVER_IP);
                document.getElementById("copyIp").textContent = "IP СКОПИРОВАН!";
            } catch (error) {
                prompt("Скопируй IP сервера:", SERVER_IP);
            }
        });

        // Управление музыкой
        const music = document.getElementById("music");
        const musicButton = document.getElementById("musicButton");

        musicButton.addEventListener("click", async () => {
            if (music.paused) {
                try {
                    await music.play();
                    musicButton.textContent = "♫";
                } catch (error) {
                    alert("Не удалось запустить музыку. Проверь файл music.mp3.");
                }
            } else {
                music.pause();
                musicButton.textContent = "♪";
            }
        });
    </script>
</body>
</html>
